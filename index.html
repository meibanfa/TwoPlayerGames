<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="和朋友开个房间，来一局互坑扫雷"><title>双人小游戏</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main id="app">
    <section id="homeView" class="view"><p class="eyebrow">双人实时对战</p><h1>双人小游戏</h1><p class="lead">和朋友开个房间，来一局。</p><article class="game-card"><div class="game-icon">💣</div><div><h2>互坑扫雷</h2><p>你埋雷，我来扫。双人实时心理博弈。</p></div><button id="startBtn" class="btn primary">开始游戏</button></article></section>
    <section id="lobbyView" class="view hidden"><button id="backHomeBtn" class="link">← 返回首页</button><h1>互坑扫雷</h1><div class="lobby-grid"><form id="createForm" class="panel"><h2>创建房间</h2><label>你的昵称<input id="createName" maxlength="24" placeholder="玩家 1" required></label><button class="btn primary">创建房间</button></form><form id="joinForm" class="panel"><h2>加入房间</h2><label>你的昵称<input id="joinName" maxlength="24" placeholder="玩家 2" required></label><label>房间码<input id="roomCode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="四位数字" required></label><button class="btn primary">加入房间</button></form></div><p id="lobbyMessage" class="message"></p></section>
    <section id="gameView" class="view hidden"><header class="game-header"><div><button id="leaveBtn" class="link">← 离开房间</button><h1>互坑扫雷</h1><p id="roomLabel"></p></div><button id="rulesBtn" class="btn">游戏规则</button></header><div id="gameMount"></div><div id="opponentProgress" class="progress"></div><button id="restartBtn" class="btn hidden">再来一局</button></section>
    <dialog id="rulesDialog"><h2>互坑扫雷怎么玩</h2><p>第一阶段，你需要在棋盘中埋下 15 颗雷，这张地图会交给你的对手。双方布雷完成后交换地图，同时开始扫雷。数字表示周围 8 个格子中的地雷数量。这里没有第一步保护——你的对手可能专门把雷埋在你最想点的位置。踩雷不会立刻出局，但会增加 10 秒罚时。清空所有安全格会记录完成时间；有效用时等于实际扫雷用时加罚时，有效用时更低者获胜。双方在短暂结算窗口内完成时，稍后完成的玩家也可能凭更低有效用时获胜。</p><button id="closeRules" class="btn primary">知道了</button></dialog>
  </main>
  <script src="js/registry.js"></script><script src="js/games/minesweeper-duel-logic.js"></script><script src="js/games/minesweeper-duel.js"></script><script src="js/net.js"></script><script src="js/main.js"></script>
</body></html>
