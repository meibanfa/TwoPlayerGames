<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="和朋友开个房间，来一局双人小游戏"><title>双人小游戏</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main id="app">
    <section id="homeView" class="view"><p class="eyebrow">双人实时对战</p><h1>双人小游戏</h1><p class="lead">和朋友开个房间，来一局。</p><div id="gameCards" class="game-cards"></div></section>
    <section id="lobbyView" class="view hidden"><button id="backHomeBtn" class="link">← 返回首页</button><h1 id="lobbyGameTitle"></h1><p id="lobbyGameDescription" class="lead"></p><div class="lobby-grid"><form id="createForm" class="panel"><h2>创建房间</h2><label>你的昵称<input id="createName" maxlength="24" placeholder="玩家 1" required></label><button class="btn primary">创建房间</button></form><form id="joinForm" class="panel"><h2>加入房间</h2><label>你的昵称<input id="joinName" maxlength="24" placeholder="玩家 2" required></label><label>房间码<input id="roomCode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="四位数字" required></label><button class="btn primary">加入房间</button></form></div><p id="lobbyMessage" class="message" aria-live="polite"></p></section>
    <section id="gameView" class="view hidden"><header class="game-header"><div><button id="leaveBtn" class="link">← 离开房间</button><h1 id="activeGameTitle"></h1><p id="roomLabel"></p></div><button id="rulesBtn" class="btn">游戏规则</button></header><div id="gameMount"></div><button id="restartBtn" class="btn hidden">再来一局</button></section>
    <dialog id="rulesDialog"><h2 id="rulesTitle"></h2><div id="rulesContent"></div><button id="closeRules" class="btn primary">知道了</button></dialog>
  </main>
  <script src="js/registry.js"></script><script src="js/games/minesweeper-duel-logic.js"></script><script src="js/games/minesweeper-duel.js"></script><script src="js/net.js"></script><script src="js/main.js"></script>
</body></html>
