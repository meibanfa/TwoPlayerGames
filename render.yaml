# yaml-language-server: $schema=https://json.schemastore.org/render.yaml
services:
  - type: web
    name: shuangren-xiaoyouxi
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
